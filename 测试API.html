<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek API测试</title>
  <style>
    body {
      background: #080c18;
      color: #ddd0b0;
      font-family: 'Noto Serif SC', serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }
    h1 { color: #c8a84b; }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      background: #101228;
      border: 1px solid #252540;
      color: #ddd0b0;
      border-radius: 6px;
    }
    button {
      padding: 12px 24px;
      background: #2a5a4a;
      color: #ddd0b0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background: #3a6a5a; }
    #result {
      margin-top: 20px;
      padding: 15px;
      background: #101228;
      border: 1px solid #252540;
      border-radius: 8px;
      white-space: pre-wrap;
    }
    .success { color: #6a9a6a; }
    .error { color: #c47a2a; }
  </style>
</head>
<body>
  <h1>🔑 DeepSeek API测试工具</h1>
  <p>用于测试你的API密钥是否有效</p>
  
  <input type="password" id="apiKey" placeholder="输入API密钥 (sk-...)" />
  <button onclick="testAPI()">测试API</button>
  
  <div id="result"></div>

  <script>
    async function testAPI() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const resultDiv = document.getElementById('result');
      
      if (!apiKey) {
        resultDiv.innerHTML = '<span class="error">❌ 请输入API密钥</span>';
        return;
      }
      
      resultDiv.innerHTML = '⏳ 测试中...';
      
      try {
        const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: [{
              role: 'user',
              content: '请用一句话介绍你自己'
            }],
            max_tokens: 100
          })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          resultDiv.innerHTML = `<span class="success">✅ API密钥有效！</span>\n\n响应内容：\n${data.choices[0].message.content}`;
        } else {
          resultDiv.innerHTML = `<span class="error">❌ API调用失败</span>\n\n错误信息：\n${JSON.stringify(data, null, 2)}`;
        }
      } catch (error) {
        resultDiv.innerHTML = `<span class="error">❌ 网络错误</span>\n\n${error.message}`;
      }
    }
  </script>
</body>
</html>
